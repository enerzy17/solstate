name: Refresh Solana report

# Automation strategy, in three parts:
#   1. cron drives the refresh
#   2. the sqlite history is cached between runs, which is what lets the
#      statistical anomaly baseline accumulate instead of resetting cold
#   3. the outputs are both committed (so the repo shows a real history of the
#      chain) and published to Pages (so there is a live hosted dashboard)
#
# Note there are no `secrets` anywhere in this file. That is the point: every
# source the report publishes is public and unauthenticated.

on:
  schedule:
    - cron: "17 */2 * * *"      # every two hours, off the hour to dodge the stampede
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solstate-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `pip install` step. There is nothing to install.

      - name: Restore metric history
        uses: actions/cache/restore@v4
        with:
          path: out/history.db
          key: solstate-history-${{ github.run_id }}
          restore-keys: solstate-history-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m solstate --out out

      - name: Save metric history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: out/history.db
          key: solstate-history-${{ github.run_id }}

      - name: Commit refreshed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/report.json out/report.md out/index.html
          git diff --staged --quiet || git commit -m "chore: refresh Solana report [skip ci]"
          git push

      # GITHUB PAGES IS BEST EFFORT, AND THE REASON MATTERS.
      #
      # `enablement: true` is supposed to turn Pages on through the API on the
      # first run. It does not work here and cannot be made to: GitHub does not
      # let GITHUB_TOKEN create a Pages site that has never existed, so the step
      # fails with "Resource not accessible by integration" every single time.
      # Enabling it is a one time manual action in Settings, Pages, Source,
      # GitHub Actions. Re-running the workflow will never fix it.
      #
      # Until this change that failure took the WHOLE WORKFLOW down with it. Ten
      # consecutive runs showed a red X even though the tests passed, the report
      # regenerated, and the refreshed output was committed and pushed. Every
      # one of those runs did its actual job.
      #
      # On a project whose entire claim is that it updates itself, a permanently
      # red badge is worse than a missing dashboard. It tells anyone who looks
      # that the automation is broken, when the automation is precisely the part
      # that works. So the real work now decides the badge, and the dashboard
      # deploy is allowed to be absent without lying about everything else.
      #
      # If Pages is enabled later, nothing here needs to change: the step starts
      # succeeding and the deploy runs on its own.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Absent, but never silently absent. A skipped deploy that says nothing is
      # how this sat unnoticed in the first place.
      - name: Say where the dashboard is, or say that it is not there
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "Pages deploy ran. Dashboard: https://enerzy17.github.io/solstate/"
          else
            echo "::warning title=GitHub Pages is not enabled::The report built, tested and committed correctly, but there is no hosted dashboard. GITHUB_TOKEN cannot create a Pages site that has never existed. Fix once at Settings, Pages, Source, GitHub Actions. Until then the committed dashboard is readable at https://raw.githack.com/enerzy17/solstate/main/out/index.html"
          fi
