name: Refresh Solana report

# Automation strategy, in three parts:
#   1. cron drives the refresh
#   2. the sqlite history is cached between runs, which is what lets the
#      statistical anomaly baseline accumulate instead of resetting cold
#   3. the outputs are both committed (so the repo shows a real history of the
#      chain) and published to Pages (so there is a live hosted dashboard)
#
# Note there are no `secrets` anywhere in this file. That is the point: every
# source the report publishes is public and unauthenticated.

on:
  schedule:
    - cron: "17 */2 * * *"      # every two hours, off the hour to dodge the stampede
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solstate-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `pip install` step. There is nothing to install.

      - name: Restore metric history
        uses: actions/cache/restore@v4
        with:
          path: out/history.db
          key: solstate-history-${{ github.run_id }}
          restore-keys: solstate-history-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m solstate --out out

      - name: Save metric history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: out/history.db
          key: solstate-history-${{ github.run_id }}

      - name: Commit refreshed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/report.json out/report.md out/index.html
          git diff --staged --quiet || git commit -m "chore: refresh Solana report [skip ci]"
          git push

      # GITHUB PAGES IS BEST EFFORT, AND THE REASON MATTERS.
      #
      # Pages was enabled on 2026-08-09 and the dashboard now publishes to
      # https://enerzy17.github.io/solstate/ on every run. These three steps are
      # deliberately left tolerant anyway, because of how they behaved before.
      #
      # `enablement: true` is supposed to turn Pages on through the API on the
      # first run. It never worked: GitHub does not let GITHUB_TOKEN create a
      # Pages site that has never existed, so the step failed with "Resource not
      # accessible by integration" every single time. It took a call to
      # POST /repos/{owner}/{repo}/pages with a token carrying `repo` scope to
      # create the site once. Re-running the workflow would never have fixed it.
      #
      # Until that was done, this step took the WHOLE WORKFLOW down with it. Ten
      # consecutive runs showed a red X even though the tests passed, the report
      # regenerated, and the refreshed output was committed and pushed. Every
      # one of those runs did its actual job.
      #
      # On a project whose entire claim is that it updates itself, a permanently
      # red badge is worse than a missing dashboard: it tells anyone who looks
      # that the automation is broken, when the automation is precisely the part
      # that works. So the real work decides the badge, and a Pages outage
      # degrades the dashboard without lying about everything else.
      #
      # ⛔ Use `steps.pages.outcome`, not `.conclusion`. With continue-on-error
      # the API reports conclusion `success` even when the step really failed;
      # `outcome` is the one that holds the truth.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Absent, but never silently absent. A skipped deploy that says nothing is
      # how this sat unnoticed in the first place.
      - name: Say where the dashboard is, or say that it is not there
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "Pages deploy ran. Dashboard: https://enerzy17.github.io/solstate/"
          else
            echo "::warning title=GitHub Pages did not deploy::The report built, tested and committed correctly, but the hosted dashboard did not update, so https://enerzy17.github.io/solstate/ is serving an older run. The committed dashboard is current and readable at https://raw.githack.com/enerzy17/solstate/main/out/index.html and in out/report.md in this repository."
          fi
